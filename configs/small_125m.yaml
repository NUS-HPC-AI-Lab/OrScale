model:
  preset: small
  max_seq_len: 1024
  norm_type: rmsnorm
  mlp_type: relusqr
  pos_encoding: rope
  bias: false
  tie_weights: true

data:
  train_pattern: "/home/svu/e0572481/scratch/fineweb10B/fineweb_train_*.bin"
  val_pattern: "/home/svu/e0572481/scratch/fineweb10B/fineweb_val_*.bin"
  streaming: false

training:
  max_steps: 20000
  warmup_steps: 1000
  grad_accum_steps: 4
  precision: bfloat16
  val_every: 500
  val_steps: 20
  log_every: 10
  save_every: 5000
  save_dir: /home/svu/e0572481/scratch/checkpoints/small_125m
  batch_size: 32
  seed: 42

optimizer:
  name: muscale_alpha
  lr: 0.02
  momentum: 0.95
  weight_decay: 0.01
  alpha: 0.5
  r_min: 0.5
  r_max: 1.5
  eps: 1.0e-6
  ns_iters: 5
  adamw_lr: 0.001
  adamw_betas: [0.9, 0.999]
  adamw_weight_decay: 0.01

diagnostics:
  log_every: 50
  heavy_log_every: 500

logging:
  wandb_project: orscale-fineweb10B
  wandb_group: small_125m
