# CIFAR-10 on DavidNet (DAWNBench / LAMB Table 6 / Muon-post speedrun)
#
# Reference global batch size 512. Use `--set` or a multi-node launcher to
# scale. DavidNet ~6.5M params, 24 epochs ~= 94 val acc on a single GPU with
# AdamW; Muon / MuScale-alpha are the focus of this sweep.

task: vision

model:
  name: davidnet
  num_classes: 10

data:
  name: cifar10
  root: data/cifar10
  augment: true
  num_workers: 4
  download: true

training:
  epochs: 24
  batch_size: 512          # per-rank; multiply by world_size for global bs
  grad_clip: 0.0
  precision: bfloat16
  log_every: 50
  save_every_epoch: 0
  save_dir: checkpoints/cifar10_davidnet
  seed: 42
  label_smoothing: 0.0

optimizer:
  name: muscale_alpha
  lr: 0.02
  momentum: 0.95
  weight_decay: 5.0e-4
  alpha: 0.5
  r_min: 0.1
  r_max: 10.0
  eps: 1.0e-6
  ns_iters: 5
  adamw_lr: 1.0e-3
  adamw_betas: [0.9, 0.999]
  adamw_weight_decay: 5.0e-4

scheduler:
  name: cosine
  warmup_steps: 500
  min_lr_ratio: 0.0

diagnostics:
  log_every: 50
  heavy_log_every: 500

logging:
  wandb_project: orscale-vision
  wandb_group: cifar10_davidnet
