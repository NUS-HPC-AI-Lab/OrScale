model:
  preset: medium
  max_seq_len: 1024
  norm_type: rmsnorm
  mlp_type: relusqr
  pos_encoding: rope
  bias: false
  tie_weights: true

data:
  train_pattern: "data/fineweb10B/fineweb_train_*.bin"
  val_pattern: "data/fineweb10B/fineweb_val_*.bin"
  streaming: false

training:
  max_steps: 40000
  warmup_steps: 1000
  grad_accum_steps: 8
  precision: bfloat16
  val_every: 1000
  val_steps: 20
  log_every: 10
  save_every: 10000
  save_dir: checkpoints/medium_350m
  batch_size: 16
  seed: 42

optimizer:
  name: muscale_alpha
  lr: 0.02
  momentum: 0.95
  weight_decay: 0.01
  alpha: 0.5
  r_min: 0.5
  r_max: 1.5
  eps: 1.0e-6
  ns_iters: 5
  adamw_lr: 0.001
  adamw_betas: [0.9, 0.999]
  adamw_weight_decay: 0.01

diagnostics:
  log_every: 100
  heavy_log_every: 1000

logging:
  wandb_project: orscale
  wandb_group: medium_350m
