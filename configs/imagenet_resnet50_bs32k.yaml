# ImageNet / ResNet-50 at global batch 32K (LAMB Table 5 / Sec 4.2).
#
# Doubles the batch of imagenet_resnet50_bs16k. With 16 nodes x 8 GPUs = 128
# GPUs and per-rank bs=256, global bs = 32768. Polynomial decay is used here
# (LAMB Sec 4.1) because at very large batches step-decay produces milestones
# at too few update steps; polynomial decay is also what LAMB reports for
# BERT large-batch runs.

task: vision

model:
  name: resnet50
  num_classes: 1000
  zero_init_residual: true

data:
  name: imagenet
  root: /data/imagenet
  image_size: 224
  num_workers: 16

training:
  epochs: 90
  batch_size: 256            # per-rank; 256 * 128 = 32768 global bs
  grad_clip: 0.0
  precision: bfloat16
  log_every: 100
  save_every_epoch: 30
  save_dir: checkpoints/imagenet_resnet50_bs32k
  seed: 42
  label_smoothing: 0.1

optimizer:
  name: orscale
  lr: 0.002                  # -> sqrt(32768/512)=8x -> ~0.016
  sqrt_lr_scaling: true
  sqrt_lr_scaling_base_batch: 512
  momentum: 0.95
  weight_decay: 1.0e-4
  r_min: 0.5
  r_max: 1.5
  eps: 1.0e-6
  ns_iters: 5
  adamw_lr: 2.0e-4
  adamw_betas: [0.9, 0.999]
  adamw_weight_decay: 1.0e-4

scheduler:
  name: poly
  warmup_steps: 1500         # ~ 5 epochs at bs=32K over ImageNet-1K (1.28M images)
  power: 1.0
  min_lr_ratio: 0.0

diagnostics:
  log_every: 100
  heavy_log_every: 1000

logging:
  wandb_project: null
  wandb_group: imagenet_resnet50_bs32k
