# Tiny Moonlight-MoE config for local smoke tests.

model:
  architecture: moonlight_moe
  preset: moonlight_tiny_moe
  max_seq_len: 64
  router_aux_loss_alpha: 1.0e-3
  router_bias_update_rate: 0.0

data:
  hf_dataset: openwebtext
  max_tokens: 10000
  streaming: false

training:
  max_steps: 2
  warmup_steps: 1
  grad_accum_steps: 1
  precision: float32
  val_every: 0
  val_steps: 0
  log_every: 1
  save_every: 0
  save_dir: checkpoints/moonlight_moe_tiny
  batch_size: 2
  seed: 42

optimizer:
  name: muon_moonlight
  lr: 1.0e-3
  momentum: 0.95
  weight_decay: 0.1
  ns_iters: 5
  adamw_lr: 1.0e-3
  adamw_betas: [0.9, 0.95]
  adamw_weight_decay: 0.1

diagnostics:
  log_every: 1
  heavy_log_every: 0

logging:
  wandb_project:
  wandb_group: moonlight_moe_tiny
