# Strict Moonlight Table 2 scaling-law comparison.
#
# Primary goal: compare optimizer families without changing model size, token
# budget, learning rate, weight decay, or global batch (in tokens) across
# optimizers. Paper batch is measured in examples at 8K context length.
#
# Memory deviation from Moonlight (545m and above):
#   On 8x H20-3E (96 GB), the paper's seq_len=8192 with the listed
#   micro-batches OOMs from per-layer activation memory (DDP + bf16 + FlashSDPA,
#   no activation checkpointing). To keep the run tractable without changing
#   tokens-per-batch, max_steps, or LR, we shorten seq_len to 4096 and double
#   batch_examples for moonlight_545m / 822m / 1_1b / 1_5b.
#
#   Why this is safe for cross-optimizer comparison:
#     * tokens/batch is unchanged -> max_steps unchanged, total compute budget
#       unchanged, LR/WD schedule re-uses Moonlight's tuned per-scale values
#       (gradient noise scale in tokens dominates LR scaling; doubling
#       examples-per-batch is a sub-decimal shift not worth resweeping).
#     * Every optimizer in the matrix sees the same shortened seq_len, so the
#       optimizer ranking (the actual deliverable) is unaffected.
#
#   Why loss values are NOT directly comparable to Moonlight Table 2 at 545m+:
#     Shorter context produces systematically lower per-token loss (less
#     out-of-document noise, easier next-token prediction). The scaling-law
#     fit constants (A, B, alpha, beta) will shift accordingly. This is an
#     accepted trade-off for the optimizer-comparison goal of this experiment.
#
#   125m and 399m are unchanged (125m already at 1024; 399m fits at 8192).

base_config: configs/small_125m.yaml
output_dir: results/moonlight_scaling_strict
seeds: 1
seed_base: 42

# Runtime defaults. The runner derives:
#   grad_accum_steps = batch_examples / (micro_batch_size * world_size)
#   max_steps        = round(tokens / (batch_examples * seq_len))
world_size: 8
# Large-memory 8-GPU default: presets below set per-GPU micro-batches so the
# paper global batches run with the minimum possible accumulation.
micro_batch_size: 1

# Rough 8x H20-3E bf16 effective throughput assumption for planning only.
# Override with ESTIMATE_PFLOPS_PER_SEC in scripts/run_moonlight_scaling_8gpu.sh
# after you observe real tokens/sec on your machines.
estimate_pflops_per_second: 0.5

presets:
  # Per-preset ``lr`` is the shared Moonlight Table 2 LR used by ``adamw``,
  # ``muon_moonlight``, and ``orscale_muon_moonlight_calibrated`` (the strict
  # apples-to-apples cells). ``optimizer_lrs`` overrides the matrix-group LR
  # for one optimizer only -- used here to give uncalibrated
  # ``orscale_muon_moonlight`` its tuned LR per preset (see report rationale
  # below). The AdamW group of that optimizer still uses the preset LR via
  # ``adamw_lr: same_as_preset_lr`` in the optimizer block, matching how the
  # FineWeb post-fix sweep tuned ``orscale_muon_moonlight @ lr=3e-3``
  # (matrix=3e-3, AdamW group=1e-3).
  #
  # Uncalibrated LR rule of thumb: ~3x preset at 125m (direct evidence in
  # reports/fineweb_small/), ~2.5x preset at the larger Moonlight scales (no
  # direct sweep -- extrapolated from CIFAR/DavidNet's 2x and FineWeb's 3x).
  - name: fineweb_small_125m
    model_preset: small
    params: 1.25e8
    tokens: 5.24288e9
    seq_len: 1024
    batch_examples: 256
    micro_batch_size: 32
    lr: 1.0e-3
    optimizer_lrs:
      orscale_muon_moonlight: 3.0e-3
    overrides:
      training.save_every: 20000
  - name: moonlight_399m
    params: 3.99e8
    tokens: 8.92e9
    seq_len: 8192
    batch_examples: 96
    micro_batch_size: 12
    lr: 9.503e-4
    optimizer_lrs:
      orscale_muon_moonlight: 2.376e-3
    overrides:
      training.save_every: 11342
  # 545m+: seq_len shortened from 8192 -> 4096, batch_examples doubled to
  # keep tokens/batch (and therefore max_steps and LR schedule) invariant.
  # See header comment for rationale.
  - name: moonlight_545m
    params: 5.45e8
    tokens: 14.04e9
    seq_len: 4096
    batch_examples: 256
    # mbs=8, accum=4: same activation footprint as the original 8K/mbs=4
    # working setup (seq*mbs = 32768). Dropped from mbs=16 because that
    # operates at the fragmentation boundary with NS dynamic allocations +
    # torch.compile cache; saw flaky OOM at step 0 / NCCL hang at step 30.
    # Throughput is unchanged (gradient accumulation is essentially free
    # next to forward+backward+opt.step). Set PYTORCH_CUDA_ALLOC_CONF=
    # expandable_segments:True (see scripts/run_moonlight_scaling_8gpu.sh)
    # to additionally harden against fragmentation. Bump back to mbs=16
    # only if memory monitoring shows >40 GB headroom under the heaviest
    # optimizer (orscale_muon_moonlight_calibrated).
    micro_batch_size: 8
    lr: 9.143e-4
    optimizer_lrs:
      orscale_muon_moonlight: 2.286e-3
    overrides:
      training.save_every: 13390
      # Confirmed 195k tok/s at 545m (vs 141.5k pre-changes, +38%).
      # Compile speedup is real once the allocator config is right:
      # PYTORCH_CUDA_ALLOC_CONF must be exactly "expandable_segments:True"
      # WITHOUT max_split_size_mb (the latter pessimizes both expandable
      # segments and torch.compile workspace allocation). The earlier
      # 110k-with-compile regression was caused by max_split_size_mb:512
      # in the env, not by compile itself.
      training.compile: true
  - name: moonlight_822m
    params: 8.22e8
    tokens: 20.76e9
    seq_len: 4096
    batch_examples: 320
    # Conservative mbs=10 (accum=4) to mirror the safety margin used at 545m
    # under fragmentation pressure with the calibrated optimizer variant.
    # Bump to 20 if 545m runs cleanly with headroom.
    micro_batch_size: 10
    lr: 8.825e-4
    optimizer_lrs:
      orscale_muon_moonlight: 2.206e-3
    overrides:
      training.save_every: 15839
      training.compile: true
  - name: moonlight_1_1b
    params: 1.1e9
    tokens: 28.54e9
    seq_len: 4096
    batch_examples: 384
    # mbs=8 (accum=6) is the no-activation-checkpointing plan. mbs=12 only
    # works reliably with model.checkpoint_mlp=true; without it, torch.compile
    # can materialize large fp32 norm/MLP workspaces at step 0.
    micro_batch_size: 8
    lr: 8.561e-4
    optimizer_lrs:
      orscale_muon_moonlight: 2.140e-3
    overrides:
      training.save_every: 18146
      training.compile: true
      model.checkpoint_mlp: false
  - name: moonlight_1_5b
    params: 1.5e9
    tokens: 38.91e9
    seq_len: 4096
    batch_examples: 512
    # mbs=8 (accum=8) with checkpoint_mlp on: optimizer state at 1.5B is
    # ~25 GB; without AC, mbs=8 means ~60 GB activations and likely OOM.
    # With AC, activations drop to ~18 GB -> total ~50 GB, comfortable.
    # AC is essentially mandatory for the calibrated optimizer at this scale.
    micro_batch_size: 8
    lr: 8.305e-4
    optimizer_lrs:
      orscale_muon_moonlight: 2.076e-3
    overrides:
      training.save_every: 18554
      training.compile: true
      model.checkpoint_mlp: true

# Moonlight uses AdamW betas ``(0.9, 0.95)`` for its dense-LM baselines
# (arXiv:2502.16982). Both the standalone ``adamw`` row and the AdamW group
# of every Muon-family variant inherit those betas here.
optimizers:
  - name: adamw
    weight_decay: 0.1
    betas: [0.9, 0.95]
  - name: muon_moonlight
    weight_decay: 0.1
    adamw_lr: same_as_lr
    adamw_weight_decay: 0.1
    adamw_betas: [0.9, 0.95]
  - name: orscale_muon_moonlight
    weight_decay: 0.1
    # Matrix LR is overridden per preset via ``optimizer_lrs`` above. The
    # AdamW group stays anchored to the preset LR to mirror the FineWeb
    # post-fix sweep that tuned this variant.
    adamw_lr: same_as_preset_lr
    adamw_weight_decay: 0.1
    adamw_betas: [0.9, 0.95]
    r_min: 0.1
    r_max: 5.0
  - name: orscale_muon_moonlight_calibrated
    weight_decay: 0.1
    adamw_lr: same_as_lr
    adamw_weight_decay: 0.1
    adamw_betas: [0.9, 0.95]
    r_min: 0.1
    r_max: 5.0

launcher:
  command: torchrun
  extra_args:
    - --standalone
    - --nproc_per_node=8
