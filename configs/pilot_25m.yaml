model:
  preset: tiny
  max_seq_len: 512
  norm_type: rmsnorm
  mlp_type: relusqr
  pos_encoding: rope
  bias: false
  tie_weights: true

data:
  train_pattern: "data/fineweb10B/fineweb_train_*.bin"
  val_pattern: "data/fineweb10B/fineweb_val_*.bin"
  streaming: false

training:
  max_steps: 5000
  warmup_steps: 500
  grad_accum_steps: 1
  precision: bfloat16
  val_every: 500
  val_steps: 20
  log_every: 10
  save_every: 0
  save_dir: checkpoints/pilot_25m
  batch_size: 64
  seed: 42

optimizer:
  name: muscale_alpha
  lr: 0.02
  momentum: 0.95
  weight_decay: 0.01
  alpha: 0.5
  r_min: 0.5
  r_max: 1.5
  eps: 1.0e-6
  ns_iters: 5
  adamw_lr: 0.001
  adamw_betas: [0.9, 0.999]
  adamw_weight_decay: 0.01

diagnostics:
  log_every: 50
  heavy_log_every: 500

logging:
  wandb_project: null
  wandb_group: pilot_25m
