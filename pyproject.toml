[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orscale"
version = "0.1.0"
description = "Orthogonalized updates with layer-wise scaling for language model training."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "NUS-HPC-AI-Lab" },
]
keywords = [
  "deep-learning",
  "language-models",
  "optimization",
  "pytorch",
  "training",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2.0",
  "numpy",
  "pyyaml",
  "tqdm",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.6.0",
  "scipy>=1.10.0",
]
data = [
  "datasets",
  "huggingface-hub",
  "tiktoken",
]
eval = [
  "lm-eval>=0.4.0",
  "tiktoken",
]
vision = [
  "scipy>=1.10.0",
  "torchvision>=0.17.0",
]
wandb = [
  "wandb",
]
dev = [
  "pytest",
]
all = [
  "datasets",
  "huggingface-hub",
  "lm-eval>=0.4.0",
  "matplotlib>=3.6.0",
  "scipy>=1.10.0",
  "tiktoken",
  "torchvision>=0.17.0",
  "wandb",
]

[project.urls]
Homepage = "https://github.com/NUS-HPC-AI-Lab/OrScale"
Repository = "https://github.com/NUS-HPC-AI-Lab/OrScale"
Issues = "https://github.com/NUS-HPC-AI-Lab/OrScale/issues"

[tool.setuptools.packages.find]
include = ["orscale*"]
